name: PBS Rebuild Drill

# Cattle reproducibility proof for the same-host PBS restore tier.
# Builds an ephemeral PBS VM from Git artifacts only (real cloud-init
# template rendered via tofu console, repo vm-provisioner.sh, repo PBS
# contract via enforce-pve-host-backup-stack.sh --check with PBS_VM_ID
# override), then destroys it. Live PBS (VM 905) is never touched.
#
# 2026-08-09 review gap: "migration success is not a reproducibility
# proof". This drill converts that one-off proof into a scheduled,
# repo-owned regression.

on:
  workflow_dispatch:
  schedule:
    # Sundays 19:00 UTC = Sundays 05:00 AEST (next day, AEST=UTC+10)
    - cron: '0 19 * * 0'

concurrency:
  group: pbs-rebuild-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ["self-hosted", "LAN", "drill-runner"]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight — drill VMID/IP free, PVE reachable
        run: |
          set -e
          SSH="ssh -i ~/.ssh/pve-kai -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.1.50"
          # MAC-aware: a leftover drill VM reuses BC:24:11:AA:90:07, so ANY
          # other responder on .250 is a foreign squatter (2026-09-07 RCA: a
          # Bilian IoT device held .248 and shot the restore drill).
          OWNER="$($SSH "arping -c 2 -I vmbr0 192.168.1.250 2>/dev/null | grep -oE '\\[[0-9A-Fa-f:]+\\]' | tr -d '[]' | sort -u | head -1" 2>/dev/null)"
          if [ -n "$OWNER" ] && [ "$OWNER" != "BC:24:11:AA:90:07" ]; then
            echo "::error::192.168.1.250 (drill IP) is occupied by foreign MAC $OWNER — aborting"; exit 1
          fi
          $SSH 'qm status 907' \
            && { echo "::error::VM 907 already exists — refusing to run drill"; exit 1; } \
            || echo "[OK] VM 907 free, drill IP free"

      - name: Run PBS rebuild drill
        run: bash scripts/pbs-rebuild-drill.sh

      - name: Post-job — assert drill VM destroyed and lock released
        if: always()
        run: |
          set -e
          SSH="ssh -i ~/.ssh/pve-kai -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.1.50"
          if $SSH 'qm config 907 >/dev/null 2>&1'; then
            echo "::error::drill VM 907 still exists after run (cleanup failed) — destroy: qm stop 907 --timeout 30 && qm destroy 907 --purge"
            exit 1
          fi
          if flock -n /tmp/pbs-drill.lock -c true 2>/dev/null; then
            echo "[OK] drill VM 907 destroyed, lock free"
          else
            echo "::error::drill lock still held after run"
            exit 1
          fi
