name: Infra Apply

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily drift check — 09:00 Melbourne time (AEST = UTC+10)
    # Using cron schedule so CI runs independently of code changes.
    - cron: "0 23 * * *"

jobs:
  cloud-init-template-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            infrastructure/terraform/modules/vm/templates
            scripts
          sparse-checkout-cone-mode: false

      - name: Enforce write_files-based k3s cloud-init templates
        run: |
          set -euo pipefail
          MASTER=infrastructure/terraform/modules/vm/templates/cloud-init-master.yaml.tftpl
          WORKER=infrastructure/terraform/modules/vm/templates/cloud-init-worker.yaml.tftpl

          grep -q "path: /etc/rancher/k3s/config.yaml" "$MASTER"
          grep -q "path: /etc/rancher/k3s/config.yaml" "$WORKER"
          grep -q "path: /var/lib/rancher/k3s/server/manifests/kube-vip-rbac.yaml" "$MASTER"
          grep -q "path: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml" "$MASTER"

          # 2026-09-03 RCA boot-pin contract: GRUB must boot saved-default and
          # unattended upgrades must never reboot k3s nodes. Non-removable —
          # removing these reintroduces silent kernel jumps on unplanned reboots.
          for tmpl in "$MASTER" "$WORKER"; do
            grep -q "path: /etc/apt/apt.conf.d/98k8s-kernel-policy" "$tmpl"
            grep -q "Automatic-Reboot \"false\"" "$tmpl"
            grep -q "path: /etc/needrestart/conf.d/98-k8s-cattle.conf" "$tmpl"
            grep -q "path: /etc/default/grub.d/98-k8s-boot-pin.cfg" "$tmpl"
            grep -q "GRUB_DEFAULT=saved" "$tmpl"
          done

          if grep -R -n "cat > /etc/rancher/k3s/config.yaml <<'EOF'\|cat > /var/lib/rancher/k3s/server/manifests/kube-vip" infrastructure/terraform/modules/vm/templates; then
            echo "::error::k3s cloud-init templates must not render shell heredocs for k3s/kube-vip files; use write_files instead"
            exit 1
          fi

      - name: Validate k3s node-label cloud-init contract
        run: bash scripts/validate-k3s-cloud-init-node-labels.sh

  tofu:
    needs: cloud-init-template-contract
    uses: ./.github/workflows/tofu.yml
    with:
      runner_labels: '["self-hosted", "LAN", "moltbot"]'
      tofu_version: "1.11.6"
      terraform_dir: infrastructure/terraform
      checkout_path: "."
    secrets:
      PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
      PVE_SSH_PRIVATE_KEY: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
      TOFU_BACKEND_ACCESS_KEY: ${{ secrets.TOFU_BACKEND_ACCESS_KEY }}
      TOFU_BACKEND_SECRET_KEY: ${{ secrets.TOFU_BACKEND_SECRET_KEY }}
      TOFU_BACKEND_ENDPOINT: ${{ secrets.TOFU_BACKEND_ENDPOINT }}
      GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
      GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
      GARAGE_ENDPOINT_URL_OVERRIDE: ${{ secrets.GARAGE_ENDPOINT_URL_OVERRIDE }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_APPROLE_ROLE_ID: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
      VAULT_APPROLE_SECRET_ID: ${{ secrets.VAULT_APPROLE_SECRET_ID }}
      VAULT_MIGRATION_APPROLE_ROLE_ID: ${{ secrets.VAULT_MIGRATION_APPROLE_ROLE_ID }}
      VAULT_MIGRATION_APPROLE_SECRET_ID: ${{ secrets.VAULT_MIGRATION_APPROLE_SECRET_ID }}
      K3S_TOKEN: ${{ secrets.K3S_TOKEN }}

  k8s-multipath-hardening:
    needs: tofu
    if: needs.tofu.result == 'success'
    runs-on: self-hosted
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL_OVERRIDE: ${{ secrets.GARAGE_ENDPOINT_URL_OVERRIDE }}
      AWS_EC2_METADATA_SERVICE_ENDPOINT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            infrastructure
            scripts
          sparse-checkout-cone-mode: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.6"

      - name: Write node SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.PVE_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/pve-kai"
          chmod 600 "$HOME/.ssh/pve-kai"

      - name: OpenTofu init
        run: |
          cd infrastructure/terraform
          cat > /tmp/tofu-backend.hcl <<EOF
          endpoint   = "http://192.168.1.246:9000"
          access_key = "${{ secrets.TOFU_BACKEND_ACCESS_KEY }}"
          secret_key = "${{ secrets.TOFU_BACKEND_SECRET_KEY }}"
          EOF
          chmod 600 /tmp/tofu-backend.hcl
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL_OVERRIDE
          tofu init -reconfigure -backend-config=/tmp/tofu-backend.hcl

      - name: Verify multipath hardening on PRs
        if: github.event_name == 'pull_request'
        run: |
          SCRIPT_PATH="scripts/enforce-k8s-multipath-hardening.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --check

      - name: Enforce multipath hardening on managed k8s nodes
        if: github.event_name != 'pull_request'
        run: |
          SCRIPT_PATH="scripts/enforce-k8s-multipath-hardening.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --enforce

  k8s-cloud-init-sudoers-hygiene:
    needs: tofu
    if: needs.tofu.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            infrastructure
            scripts
          sparse-checkout-cone-mode: false

      - name: Write node SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.PVE_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/pve-kai"
          chmod 600 "$HOME/.ssh/pve-kai"

      - name: Verify cloud-init sudoers hygiene on PRs
        if: github.event_name == 'pull_request'
        run: |
          SCRIPT_PATH="scripts/enforce-k8s-cloud-init-sudoers.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --check

      - name: Enforce cloud-init sudoers hygiene on managed k8s nodes
        if: github.event_name != 'pull_request'
        run: |
          SCRIPT_PATH="scripts/enforce-k8s-cloud-init-sudoers.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --enforce

  k8s-k3s-config-node-label-convergence:
    needs: tofu
    if: needs.tofu.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            infrastructure
            scripts
          sparse-checkout-cone-mode: false

      - name: Write node SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.PVE_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/pve-kai"
          chmod 600 "$HOME/.ssh/pve-kai"

      - name: Verify k3s config/node-label convergence on PRs
        if: github.event_name == 'pull_request'
        env:
          K3S_TOKEN: ${{ secrets.K3S_TOKEN }}
        run: |
          SCRIPT_PATH="scripts/enforce-k8s-k3s-config.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --check

      - name: Enforce k3s config/node-label convergence on managed k8s nodes
        if: github.event_name != 'pull_request'
        env:
          K3S_TOKEN: ${{ secrets.K3S_TOKEN }}
        run: |
          SCRIPT_PATH="scripts/enforce-k8s-k3s-config.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --enforce

  k8s-kernel-parity-contract:
    needs: tofu
    if: needs.tofu.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            infrastructure
            scripts
          sparse-checkout-cone-mode: false

      # 2026-09-03 RCA: uncoordinated node reboot + silent GRUB kernel jump
      # (GRUB_DEFAULT=0 booted idle 6.8.0-138) wedged Longhorn engines for
      # 14.5h. The parity contract pins: no unattended auto-reboot, needrestart
      # list-only, GRUB saved-default, running kernel == Git contract.
      # Uses the script's default VM SSH key (~/.ssh/id_ed25519) — the same key
      # the k8s-k3s-config-node-label-convergence job relies on. Env-set
      # VM_SSH_KEY_PATH values are passed literally by GHA (no $HOME expansion)
      # and broke this job on the first run.
      - name: Verify k8s kernel parity contract on PRs
        if: github.event_name == 'pull_request'
        env:
          LIVE_CHECK: "0"
        run: |
          SCRIPT_PATH="scripts/enforce-k8s-kernel-parity.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --check

      - name: Enforce k8s kernel parity contract on live nodes
        if: github.event_name != 'pull_request'
        run: |
          SCRIPT_PATH="scripts/enforce-k8s-kernel-parity.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --enforce

  garage-vm-bootstrap-reconcile:
    needs: tofu
    if: needs.tofu.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            infrastructure
            scripts
          sparse-checkout-cone-mode: false

      - name: Install PyYAML
        run: |
          if ! python3 -m pip --version >/dev/null 2>&1; then
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
            python3 /tmp/get-pip.py --user --break-system-packages
          fi
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user pyyaml

      - name: Write PVE SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.PVE_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/pve-kai"
          chmod 600 "$HOME/.ssh/pve-kai"

      - name: Write terraform.tfvars from secrets
        run: |
          cat > infrastructure/terraform/terraform.tfvars <<'TFVARS'
          vault_addr = "${{ secrets.VAULT_ADDR }}"
          vault_approle_role_id = "${{ secrets.VAULT_APPROLE_ROLE_ID }}"
          vault_approle_secret_id = "${{ secrets.VAULT_APPROLE_SECRET_ID }}"
          vault_migration_approle_role_id = "${{ secrets.VAULT_MIGRATION_APPROLE_ROLE_ID }}"
          vault_migration_approle_secret_id = "${{ secrets.VAULT_MIGRATION_APPROLE_SECRET_ID }}"
          TFVARS
          chmod 600 infrastructure/terraform/terraform.tfvars

      - name: Verify Garage VM bootstrap convergence on PRs
        if: github.event_name == 'pull_request'
        run: |
          SCRIPT_PATH="scripts/enforce-garage-vm-bootstrap.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --check

      - name: Enforce Garage VM bootstrap convergence on managed Garage nodes
        if: github.event_name != 'pull_request'
        run: |
          SCRIPT_PATH="scripts/enforce-garage-vm-bootstrap.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --enforce

  pve-host-backup-stack:
    needs: tofu
    if: needs.tofu.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            infrastructure
            scripts
          sparse-checkout-cone-mode: false

      - name: Write PVE SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.PVE_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/pve-kai"
          chmod 600 "$HOME/.ssh/pve-kai"

      - name: Verify PVE host storage contracts on PRs
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/validate-pbs-cloud-init-datadisk.sh
          bash scripts/validate-bulkpool-storage-contract.sh
          SCRIPT_PATH="scripts/enforce-pve-host-backup-stack.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --check
          BOOTSTRAP_SCRIPT="scripts/enforce-pbs-bootstrap-scripts.sh"
          test -f "$BOOTSTRAP_SCRIPT"
          bash "$BOOTSTRAP_SCRIPT" --check
          SCRUB_SCRIPT="scripts/enforce-pve-zfs-scrub-contract.sh"
          test -f "$SCRUB_SCRIPT"
          bash "$SCRUB_SCRIPT" --check
          ARC_SCRIPT="scripts/enforce-pve-zfs-arc-cap-contract.sh"
          test -f "$ARC_SCRIPT"
          bash "$ARC_SCRIPT" --check

      - name: Verify PVE host storage contracts
        if: github.event_name != 'pull_request'
        run: |
          bash scripts/validate-pbs-cloud-init-datadisk.sh
          bash scripts/validate-bulkpool-storage-contract.sh
          SCRIPT_PATH="scripts/enforce-pve-host-backup-stack.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --check
          BOOTSTRAP_SCRIPT="scripts/enforce-pbs-bootstrap-scripts.sh"
          test -f "$BOOTSTRAP_SCRIPT"
          bash "$BOOTSTRAP_SCRIPT" --enforce
          SCRUB_SCRIPT="scripts/enforce-pve-zfs-scrub-contract.sh"
          test -f "$SCRUB_SCRIPT"
          bash "$SCRUB_SCRIPT" --check
          ARC_SCRIPT="scripts/enforce-pve-zfs-arc-cap-contract.sh"
          test -f "$ARC_SCRIPT"
          bash "$ARC_SCRIPT" --enforce

  vm201-offhost-backup-stack:
    needs: tofu
    if: needs.tofu.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            README.md
          sparse-checkout-cone-mode: false

      - name: Write PVE SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.PVE_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/pve-kai"
          chmod 600 "$HOME/.ssh/pve-kai"

      - name: Verify VM201 off-host backup contract on PRs
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/validate-vm201-offhost-backup-contract.sh
          SCRIPT_PATH="scripts/enforce-vm201-offhost-backup-stack.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --check

      - name: Enforce VM201 off-host backup contract
        if: github.event_name != 'pull_request'
        run: |
          bash scripts/validate-vm201-offhost-backup-contract.sh
          SCRIPT_PATH="scripts/enforce-vm201-offhost-backup-stack.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --enforce

  legacy-vm-memory-contract:
    needs: tofu
    if: needs.tofu.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            infrastructure
            scripts
          sparse-checkout-cone-mode: false

      - name: Write PVE SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.PVE_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/pve-kai"
          chmod 600 "$HOME/.ssh/pve-kai"

      - name: Verify legacy VM memory contract definition on PRs
        if: github.event_name == 'pull_request'
        run: |
          SCRIPT_PATH="scripts/enforce-legacy-vm-memory-contract.sh"
          test -f "$SCRIPT_PATH"
          LIVE_CHECK=0 bash "$SCRIPT_PATH" --check

      - name: Enforce legacy VM memory contract on Proxmox
        if: github.event_name != 'pull_request'
        run: |
          SCRIPT_PATH="scripts/enforce-legacy-vm-memory-contract.sh"
          test -f "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" --enforce

  # Phase 5: Drift detection — runs tofu plan and posts summary as PR comment
  # Only runs on scheduled trigger (not on push/PR to avoid noise)
  drift-check:
    if: github.event_name == 'schedule'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infrastructure/terraform
          sparse-checkout-cone-mode: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.6"

      - name: Run tofu plan
        # -refresh=false avoids bpg/proxmox provider "Plugin did not respond"
        # hangs during ReadResource for rebuilt VMs.
        # 2026-09-02 RCA: this job had TWO silent-failure bugs.
        # (1) `tofu init -backend=false` left no initialized backend, so
        #     `tofu plan` required re-init and exited 1 — the job only ever
        #     "passed" by piggybacking on stale .terraform/ state left in the
        #     runner workdir by other jobs (fragile pet coupling). Init with
        #     the same backend config as the apply job instead.
        # (2) `echo $?` after a pipeline captures tee's exit code, not tofu's
        #     — drift was never actually detected. Use PIPESTATUS.
        # 2026-09-04 RCA (fiefdom-daily-health-gate paged nightly Sep 3-4):
        # the plan var surface DIVERGED from the apply job (tofu.yml), so the
        # nightly scheduled drift-check was red for two different reasons:
        #   - proxmox_api_token was never passed. provider.tf reads
        #     var.proxmox_api_token; the apply/plan jobs pass it via
        #     -var="proxmox_api_token=...". An env var named PROXMOX_API_TOKEN
        #     is NEVER read by the bpg/proxmox provider — it was dead weight.
        #     Result: "Unable to create Proxmox VE API credentials — must
        #     provide either username and password, an API token, or a
        #     ticket" (exit 1) on every schedule run since the 09-02 fix made
        #     this job actually plan.
        #   - TF_VAR_state_backend_access_key / _secret_key and K3S_TOKEN were
        #     missing (apply sets them). Those variables default to "" in
        #     variables.tf, so the tofu-state1 cloud-init snippet (S3 keys)
        #     and the k3s master/worker cloud-init snippets (join token)
        #     rendered with EMPTY values -> phantom "must be replaced" drift
        #     (exit 2) even after credentials were fixed. Verified: plan with
        #     the apply-job var surface yields exit 0 "No changes".
        # RULE: the drift-check plan MUST be given the identical var surface
        # as the apply job (same secrets, same -var flags) — or the two plans
        # diverge by construction. The guard below fails fast when any
        # required var is missing so divergence can never silently recur.
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          AWS_ENDPOINT_URL_OVERRIDE: ${{ secrets.GARAGE_ENDPOINT_URL_OVERRIDE }}
          TF_VAR_vault_addr: ${{ secrets.VAULT_ADDR }}
          TF_VAR_vault_approle_role_id: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
          TF_VAR_vault_approle_secret_id: ${{ secrets.VAULT_APPROLE_SECRET_ID }}
          TF_VAR_vault_migration_approle_role_id: ${{ secrets.VAULT_MIGRATION_APPROLE_ROLE_ID }}
          TF_VAR_vault_migration_approle_secret_id: ${{ secrets.VAULT_MIGRATION_APPROLE_SECRET_ID }}
          TF_VAR_state_backend_access_key: ${{ secrets.TOFU_BACKEND_ACCESS_KEY }}
          TF_VAR_state_backend_secret_key: ${{ secrets.TOFU_BACKEND_SECRET_KEY }}
          K3S_TOKEN: ${{ secrets.K3S_TOKEN }}
        run: |
          cd infrastructure/terraform
          # Fail-fast guard (2026-09-04 RCA): every required var must be
          # present BEFORE planning. Missing vars previously rendered empty
          # cloud-init snippets (phantom drift) or provider-credential
          # errors; both silently turned the nightly drift-check red.
          for v in K3S_TOKEN TF_VAR_state_backend_access_key TF_VAR_state_backend_secret_key; do
            if [ -z "${!v:-}" ]; then
              echo "::error::drift-check: required variable $v is empty (apply-job var-parity contract)" >&2
              exit 1
            fi
          done
          cat > /tmp/tofu-backend.hcl <<EOF
          endpoint   = "http://192.168.1.246:9000"
          access_key = "${{ secrets.TOFU_BACKEND_ACCESS_KEY }}"
          secret_key = "${{ secrets.TOFU_BACKEND_SECRET_KEY }}"
          EOF
          chmod 600 /tmp/tofu-backend.hcl
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL_OVERRIDE
          tofu init -reconfigure -backend-config=/tmp/tofu-backend.hcl 2>&1 | tail -3
          set +e
          tofu plan -refresh=false -detailed-exitcode -lock=false \
            -var="proxmox_api_token=${{ secrets.PROXMOX_API_TOKEN }}" \
            -var="k3s_token=${K3S_TOKEN}" 2>&1 | tee /tmp/plan_output.txt
          RC=${PIPESTATUS[0]}
          set -e
          echo "PLAN_EXIT=$RC" >> $GITHUB_OUTPUT
          if [ "$RC" -eq 2 ]; then
            echo "::error::OpenTofu drift detected (plan exit 2) — see summary"
            exit 2
          elif [ "$RC" -ne 0 ]; then
            echo "::error::tofu plan failed (exit $RC)"
            exit "$RC"
          fi

      - name: Post drift summary
        if: always()
        run: |
          echo "## OpenTofu Drift Check" >> $GITHUB_STEP_SUMMARY
          echo "Plan exit code: ${{ steps.plan.outputs.PLAN_EXIT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 /tmp/plan_output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
